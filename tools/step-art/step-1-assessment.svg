<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 01 Tell Us About You: a clipboard with a short form, two rows ticked. MEDARO illustration style (after supplement-heart / -sprout): flat shapes, soft gradients, fine grain, no outlines. -->
  <defs>
    <filter id="grain" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="7" stitchTiles="stitch" result="noise"/><feColorMatrix in="noise" type="matrix" values="2.2 0 0 0 -0.6  2.2 0 0 0 -0.6  2.2 0 0 0 -0.6  0 0 0 0 0.32" result="grey"/><feComposite in="grey" in2="SourceAlpha" operator="in" result="g"/><feBlend in="g" in2="SourceGraphic" mode="soft-light" result="b"/><feComposite in="b" in2="SourceAlpha" operator="in"/></filter>
    <linearGradient id="lime" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#dcee96"/><stop offset="0.55" stop-color="#b3cb5c"/><stop offset="1" stop-color="#7f9a3c"/></linearGradient>
    <linearGradient id="board" x1="0.1" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#a6ae8a"/><stop offset="0.5" stop-color="#717c55"/><stop offset="1" stop-color="#4b5535"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#fbf6e6"/><stop offset="1" stop-color="#e9ddba"/></linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#d9ec90"/><stop offset="1" stop-color="#8ea948"/></linearGradient>
  </defs>
  <g filter="url(#grain)">
    <g transform="rotate(-6 256 270)">
      <rect x="108" y="82" width="296" height="398" rx="46" fill="url(#board)"/>
      <rect x="140" y="128" width="232" height="320" rx="24" fill="url(#paper)"/>
      <rect x="178" y="104" width="156" height="40" rx="16" fill="url(#clip)"/>
      <rect x="204" y="56" width="104" height="70" rx="30" fill="url(#clip)"/>
      <circle cx="256" cy="84" r="12" fill="#5d6842"/>
      <circle cx="192" cy="214" r="23" fill="url(#lime)"/>
      <path d="M181 214.5 l8.5 8.5 l15.5 -17" fill="none" stroke="#3e4829" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="230" y="205" width="110" height="18" rx="9" fill="#d8caa0"/>
      <circle cx="192" cy="290" r="23" fill="url(#lime)"/>
      <path d="M181 290.5 l8.5 8.5 l15.5 -17" fill="none" stroke="#3e4829" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="230" y="281" width="88" height="18" rx="9" fill="#d8caa0"/>
      <circle cx="192" cy="366" r="23" fill="#e2d6b0"/>
      <rect x="230" y="357" width="100" height="18" rx="9" fill="#e2d6b0"/>
    </g>
  </g>
</svg>
