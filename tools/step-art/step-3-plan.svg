<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 03 Move Forward With Your Plan: fulfilled through a licensed pharmacy, a plain paper pharmacy bag, folded and sealed with an olive tab, a lime label with a cross. No branding, no pills. MEDARO illustration style: flat shapes, soft gradients, fine grain, no outlines. Round 2 (2026-11-25): replaces the box. -->
  <defs>
    <filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="7" stitchTiles="stitch" result="noise"/><feColorMatrix in="noise" type="matrix" values="2.2 0 0 0 -0.6  2.2 0 0 0 -0.6  2.2 0 0 0 -0.6  0 0 0 0 0.32" result="grey"/><feComposite in="grey" in2="SourceAlpha" operator="in" result="g"/><feBlend in="g" in2="SourceGraphic" mode="soft-light" result="b"/><feComposite in="b" in2="SourceAlpha" operator="in"/></filter>
    <linearGradient id="lime" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#dcee96"/><stop offset="0.55" stop-color="#b3cb5c"/><stop offset="1" stop-color="#7f9a3c"/></linearGradient>
    <linearGradient id="board" x1="0.1" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#a6ae8a"/><stop offset="0.5" stop-color="#717c55"/><stop offset="1" stop-color="#4b5535"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#fbf6e6"/><stop offset="1" stop-color="#e9ddba"/></linearGradient>
    <linearGradient id="kraft" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#f1e6c6"/><stop offset="1" stop-color="#d9c79a"/></linearGradient>
    <linearGradient id="kraftside" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dccb9f"/><stop offset="1" stop-color="#c4b07e"/></linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#d9ec90"/><stop offset="1" stop-color="#8ea948"/></linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="1" stop-color="#f3ecd2" stop-opacity="0.55"/></linearGradient>
  </defs>
  <g filter="url(#grain)">
    <g transform="rotate(5 256 280)">
      <path d="M340 150 L392 172 L392 452 L340 466 Z" fill="url(#kraftside)"/>
      <rect x="120" y="150" width="226" height="316" rx="22" fill="url(#kraft)"/>
      <rect x="120" y="112" width="226" height="58" rx="16" fill="#e2d1a4"/>
      <path d="M340 116 L388 136 L388 172 L340 168 Z" fill="#cdb98a"/>
      <rect x="120" y="164" width="226" height="10" fill="#d6c494"/>
      <rect x="213" y="92" width="40" height="96" rx="14" fill="url(#board)"/>
      <rect x="168" y="250" width="130" height="130" rx="32" fill="url(#lime)"/>
      <rect x="221" y="272" width="24" height="86" rx="10" fill="#fbf6e6"/>
      <rect x="190" y="303" width="86" height="24" rx="10" fill="#fbf6e6"/>
    </g>
  </g>
</svg>
