<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Care row "Discuss your progress": a check-in calendar, one date circled in lime with a tick (no charts: nothing here is a result). MEDARO illustration style: flat shapes, soft gradients, fine grain, no outlines. -->
  <defs>
    <filter id="grain" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="7" stitchTiles="stitch" result="noise"/><feColorMatrix in="noise" type="matrix" values="2.2 0 0 0 -0.6  2.2 0 0 0 -0.6  2.2 0 0 0 -0.6  0 0 0 0 0.32" result="grey"/><feComposite in="grey" in2="SourceAlpha" operator="in" result="g"/><feBlend in="g" in2="SourceGraphic" mode="soft-light" result="b"/><feComposite in="b" in2="SourceAlpha" operator="in"/></filter>
    <linearGradient id="lime" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#dcee96"/><stop offset="0.55" stop-color="#b3cb5c"/><stop offset="1" stop-color="#7f9a3c"/></linearGradient>
    <linearGradient id="board" x1="0.1" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#a6ae8a"/><stop offset="0.5" stop-color="#717c55"/><stop offset="1" stop-color="#4b5535"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#fbf6e6"/><stop offset="1" stop-color="#e9ddba"/></linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#d9ec90"/><stop offset="1" stop-color="#8ea948"/></linearGradient>
    <clipPath id="page"><rect x="92" y="118" width="328" height="316" rx="46"/></clipPath>
  </defs>
  <g filter="url(#grain)">
    <g transform="rotate(-6 256 276)">
      <rect x="92" y="118" width="328" height="316" rx="46" fill="url(#paper)"/>
      <rect x="92" y="118" width="328" height="104" fill="url(#board)" clip-path="url(#page)"/>
      <rect x="160" y="78" width="34" height="88" rx="17" fill="url(#clip)"/>
      <rect x="318" y="78" width="34" height="88" rx="17" fill="url(#clip)"/>
      <rect x="138" y="262" width="56" height="44" rx="14" fill="#e2d6b0"/>
      <rect x="228" y="262" width="56" height="44" rx="14" fill="#e2d6b0"/>
      <rect x="138" y="340" width="56" height="44" rx="14" fill="#e2d6b0"/>
      <rect x="228" y="340" width="56" height="44" rx="14" fill="#e2d6b0"/>
      <rect x="318" y="340" width="56" height="44" rx="14" fill="#e2d6b0"/>
      <circle cx="346" cy="284" r="34" fill="url(#lime)"/>
      <path d="M330 285 l11 11 l21 -23" fill="none" stroke="#3e4829" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
